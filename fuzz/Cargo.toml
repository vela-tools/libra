[package]
name = "libra-fuzz"
description = "Fuzz targets for the parsers Libra runs on input from outside its trust boundary"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the targets link libFuzzer and build only under `cargo fuzz` on nightly, so
# they stay out of the workspace that stable `cargo check`, `clippy` and `test` build. The Libra crates
# are therefore reached by path rather than through the root `[workspace.dependencies]`.
[workspace]
members = ["."]

[dependencies]
libra-config = { path = "../crates/libra-config" }
libra-enforcement-scope = { path = "../crates/libra-enforcement-scope" }
libra-identity-authenticator = { path = "../crates/libra-identity-authenticator" }
libra-identity-claims = { path = "../crates/libra-identity-claims" }
libra-identity-jwks = { path = "../crates/libra-identity-jwks" }
libra-identity-jwt = { path = "../crates/libra-identity-jwt" }
libra-json-body = { path = "../crates/libra-json-body" }
libra-jsonld-context = { path = "../crates/libra-jsonld-context" }
libra-jsonld-context-layer = { path = "../crates/libra-jsonld-context-layer" }
libra-jsonld-term-expansion = { path = "../crates/libra-jsonld-term-expansion" }
libra-ngsi-ld-operation = { path = "../crates/libra-ngsi-ld-operation" }
libra-ngsi-ld-query = { path = "../crates/libra-ngsi-ld-query" }
libra-ngsi-ld-representation = { path = "../crates/libra-ngsi-ld-representation" }
libra-policy-model = { path = "../crates/libra-policy-model" }
libra-tenant = { path = "../crates/libra-tenant" }
axum = "0.8.9"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
jstrict = "0.16.0"
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

