# The lint levels of the root workspace, which a workspace of its own cannot inherit.
[lints.rust]
# An `#[expect]` whose lint no longer fires is dead weight that hides the next real violation.
unfulfilled_lint_expectations = "deny"
# Libra parses hostile input in front of the data it guards, so memory safety rests on the compiler
# alone. `forbid` cannot be lowered by an attribute inside a crate.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
# `#[allow]` is not permitted anywhere. A lint is either satisfied or, in test code only, expected
# with `#[expect]` and a reason. That `#[expect]` never appears in production code is checked by
# `tests/lint_policy.rs`, because clippy has no lint for it.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arc_with_non_send_sync = "deny"
await_holding_lock = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
future_not_send = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
