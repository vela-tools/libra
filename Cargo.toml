[workspace]
members = [".", "crates/*"]
resolver = "3"

# Every member inherits the workspace version and licence: the tree releases as a unit, not per crate.
[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
repository = "https://github.com/vela-tools/libra"
# Nothing here goes to crates.io: the proxy ships as a container image.
publish = false

[package]
name = "libra"
description = "An NGSI-LD authentication and authorization proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-build-info.workspace = true
libra-config.workspace = true
libra-identity-key-commands.workspace = true
libra-server.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
clap-markdown = "0.1.5"
clap-themes = "0.1.3"
human-panic = "2.0.8"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
libra-enforcement-attribute.workspace = true
libra-enforcement-type.workspace = true
libra-entity-preflight.workspace = true
libra-jsonld-context.workspace = true
libra-jsonld-context-layer.workspace = true
libra-linked-entity-layer.workspace = true
libra-ngsi-ld-operation.workspace = true
libra-ngsi-ld-operation-layer.workspace = true
libra-ngsi-ld-query-layer.workspace = true
libra-ngsi-ld-representation-layer.workspace = true
libra-policy-layer.workspace = true
libra-policy-model.workspace = true
libra-policy-store.workspace = true
libra-problem-details.workspace = true
libra-tenant-layer.workspace = true
libra-test-harness.workspace = true
axum = "0.8.9"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"

