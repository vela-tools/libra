[package]
name = "libra-identity-key-store"
description = "the store of principals, API key verifiers and the instance lease"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-identity-api-key.workspace = true
libra-policy-model.workspace = true
derive_more = { version = "2.1.1", features = ["display"] }
getrandom = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
ulid = { version = "3.0.0", default-features = false }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
