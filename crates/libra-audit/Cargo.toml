[package]
name = "libra-audit"
description = "the structured per-request audit record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-policy-model.workspace = true
axum = "0.8.9"
crypto-common = "0.2.2"
derive_more = { version = "2.1.1", features = ["display", "from"] }
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros", "std"] }
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
uuid = "1.29.0"

[dev-dependencies]
libra-log-capture.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
