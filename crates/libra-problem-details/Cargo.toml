[package]
name = "libra-problem-details"
description = "RFC 9457 problem details for Libra: the error taxonomy, its type URIs, and the outermost error-handling layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
hyper = "1.12.0"
iri-rs = { version = "3.4.1", features = ["static"] }
problem_details = { version = "0.11.0", features = ["axum"] }
thiserror = "2.0.21"
tower = { version = "0.5.3", features = ["timeout", "util"] }
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
