[package]
name = "libra-identity-jwt"
description = "access token validation: signature, expiry, issuer and audience"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-config.workspace = true
libra-identity-authenticator.workspace = true
libra-identity-claims.workspace = true
libra-identity-jwks.workspace = true
libra-policy-model.workspace = true
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
libra-log-capture.workspace = true
libra-test-harness.workspace = true
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
url = "2.5.8"
wiremock = "0.6.5"

[lints]
workspace = true
