[package]
name = "libra-config"
description = "Typed configuration model for Libra, loaded from defaults, TOML, and environment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-forwarding.workspace = true
libra-kebab-name.workspace = true
libra-policy-model.workspace = true
libra-via-pseudonym.workspace = true
derive_more = { version = "2.1.1", features = ["debug", "display"] }
figment2 = { version = "0.11.5", features = ["toml", "env"] }
hex = "0.4.3"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = { version = "4.7.0", default-features = false }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
url-macro = "0.2.5"

[dev-dependencies]
ipnet = "2.12.2"
pretty_assertions = "1.4.1"
serde_json = "1.0.154"
toml = "1.1.8"

[lints]
workspace = true
