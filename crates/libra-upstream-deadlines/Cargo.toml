[package]
name = "libra-upstream-deadlines"
description = "bounding how long the upstream broker may take to answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-problem-details.workspace = true
axum = "0.8.9"
http-body = "1.1.0"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
