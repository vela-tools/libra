[package]
name = "libra-identity-jwks"
description = "JWKS fetching, caching and key lookup for token validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1.9.3"
derive_more = { version = "2.1.1", features = ["display"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
libra-fetched-body.workspace = true
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
libra-log-capture.workspace = true
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
wiremock = "0.6.5"

[lints]
workspace = true
