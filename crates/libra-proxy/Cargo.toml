[package]
name = "libra-proxy"
description = "forwarding a request to the upstream broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-forwarding.workspace = true
libra-hardening.workspace = true
libra-problem-details.workspace = true
libra-tenant.workspace = true
libra-via-pseudonym.workspace = true
axum = "0.8.9"
derive_more = { version = "2.1.1", features = ["display"] }
http = "1.5.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "0.23.46", features = ["aws_lc_rs"] }
thiserror = "2.0.21"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
wiremock = "0.6.5"

[lints]
workspace = true
