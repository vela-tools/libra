[package]
name = "libra-policy-model"
description = "The authorization policy schema: conditions, effects, and every restriction kind, IRI-typed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-jsonld-term-expansion.workspace = true
libra-ngsi-ld-operation.workspace = true
libra-ngsi-ld-query.workspace = true
derive_more = { version = "2.1.1", features = ["display"] }
iri-rs = { version = "3.4.1", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
ulid = { version = "3.0.0", default-features = false }

[dev-dependencies]
http = "1.5.0"
pretty_assertions = "1.4.1"
serde_json = "1.0.154"

[lints]
workspace = true
