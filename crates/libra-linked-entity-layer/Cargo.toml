[package]
name = "libra-linked-entity-layer"
description = "Resolves what a request asks for in Linked Entity Retrieval once, and whether a restricted caller can be served it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libra-json-body.workspace = true
libra-ngsi-ld-operation.workspace = true
libra-ngsi-ld-operation-layer.workspace = true
libra-ngsi-ld-query.workspace = true
libra-ngsi-ld-query-layer.workspace = true
libra-ngsi-ld-representation.workspace = true
libra-ngsi-ld-representation-layer.workspace = true
libra-problem-details.workspace = true
axum = "0.8.9"
jstrict = "0.16.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1.5"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
