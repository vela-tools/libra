[package]
name = "libra-build-info"
description = "Build-time version metadata for Libra: the info payload, the version string, and panic metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
axum = "0.8.9"
human-panic = "2.0.8"
iri-rs = { version = "3.4.1", features = ["static"] }
serde = { version = "1.0.229", features = ["derive"] }
shadow-rs = "2.0.0"

[dev-dependencies]
serde_json = "1.0.154"

[build-dependencies]
shadow-rs = "2.0.0"

[lints]
workspace = true
