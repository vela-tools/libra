name: machete

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: machete-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      # cargo-machete walks every manifest below the working directory, so the fuzz workspace is
      # covered too.
      - run: cargo machete
