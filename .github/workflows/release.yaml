name: release

# Libra ships as a container image and nothing else, so a release is the image plus a GitHub release
# that names it. No binary archives are published.

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vela-tools/libra

jobs:
  # docker.yaml runs the same gates as a pull request before it builds, so nothing is published from
  # a tag whose commit does not pass them.
  image:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker.yaml

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all

      # Until the first stable release, the newest pre-release is published as a full release and
      # made latest, so the repository sidebar shows it; docker.yaml tags its image `latest` by the
      # same rule. Once a stable release exists, pre-releases are pre-releases and latest follows
      # stable releases only. A failed lookup fails the job rather than guessing.
      - name: Determine release type
        id: release_type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            latest=true
          else
            stable=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | select(test("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"))')
            if [[ -z "$stable" ]]; then
              latest=true
            else
              latest=false
            fi
          fi
          if [[ "$latest" == true ]]; then
            echo "makeLatest=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "makeLatest=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          # A pre-release made latest takes over from the one before it, which is demoted below.
          if [[ "$latest" == true && "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "demote=true" >> "$GITHUB_OUTPUT"
          else
            echo "demote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release body
        env:
          NOTES: ${{ steps.changelog.outputs.content }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DIGEST" ]]; then
            echo "the image job returned no digest" >&2
            exit 1
          fi
          printf '%s\n\n' "$NOTES" > release-body.md
          {
            echo "## Image"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "Multi-platform (\`linux/amd64\`, \`linux/arm64\`), digest \`${DIGEST}\`. Signed with cosign and carrying a build provenance attestation:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://${IMAGE}:${GITHUB_REF_NAME} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> release-body.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: ${{ steps.release_type.outputs.makeLatest }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          name: ${{ github.ref_name }}
          bodyFile: release-body.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # Before the first stable release, the pre-release that was latest until now was published as
      # a full release. It goes back to being a pre-release, so only the newest one stands as a
      # release. This runs after the new release is latest, so there is never a moment without one.
      - name: Mark earlier releases as pre-releases
        if: steps.release_type.outputs.demote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,isDraft \
            --jq ".[] | select(.isPrerelease | not) | select(.isDraft | not) | select(.tagName != \"${GITHUB_REF_NAME}\") | .tagName" |
            while read -r tag; do
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
            done
