name: Feature request
description: A capability Libra lacks, such as a policy condition, a kind of restriction, a setting or an endpoint.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. Follow the [Libra security policy](https://github.com/vela-tools/libra/security/policy) instead.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label.
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: Where the capability belongs.
      options:
        - Policy language
        - Enforcement of a restriction
        - Authentication
        - Configuration, management API or CLI
        - NGSI-LD or JSON-LD coverage
        - Observability or audit
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Need
      description: "What access rule you are trying to express or enforce, or what an operator cannot do today. Describe the need, not just the fix."
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: "The visible contract: policy keys, configuration keys and their values, wire shapes, defaults, and the clause if the specification defines it."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Optional; triage completes it. One checkbox per observable check: the input or situation, and the result that must hold."
      value: "- [ ] "
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
