name: Feature request
description: Suggest a new capability, a new kind of restriction, or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the existing issues first, in case it is already proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What access rule are you trying to express or enforce, and what is missing or awkward today? Describe the need, not just the fix.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should Libra do? If it affects the policy language, the configuration, authentication, or the CLI, say where.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Specification references
      description: >-
        Anything that pins down the expected behaviour: an ETSI GS CIM 009 v1.9.1 clause, an RFC, or
        how a specific broker behaves.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Example policies, requests, links, or anything else that helps.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
