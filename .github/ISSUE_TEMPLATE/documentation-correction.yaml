name: Documentation correction
description: User or operator documentation is wrong or missing.
labels: [docs]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. If the documentation promises a restriction Libra does not enforce, that is a vulnerability: follow the [Libra security policy](https://github.com/vela-tools/libra/security/policy) instead.

        Triage adds one `area:` label.
  - type: textarea
    id: passage
    attributes:
      label: Page and passage
      description: The page and the sentence that is wrong, quoted, or the topic no page covers.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct statement
      description: "What the documentation should say, and what it rests on: a clause, Libra's behaviour, a test. This is the acceptance."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
