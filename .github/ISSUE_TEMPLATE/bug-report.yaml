name: Bug report
description: Report incorrect behaviour, a crash, or an NGSI-LD request or response Libra handles against the specification.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search the existing issues first, in case it is already reported.

        Do not use this form to report a security vulnerability. A policy that allows more than it says, a response carrying data a restriction should have removed, or a credential reaching the broker is a vulnerability. Follow the [Libra security policy](https://github.com/vela-tools/libra/security/policy) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the incorrect behaviour, including the exact status code and problem details body if there was one.
      placeholder: Libra answered 400 to ..., or refused to start with ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: >-
        Describe the correct behaviour. If this is a spec-compliance issue, cite the ETSI GS CIM 009
        v1.9.1 clause, or the RFC, it violates.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest configuration, policy and request that trigger it.
      placeholder: |
        1. Policy: ...
        2. curl -s "localhost:5667/ngsi-ld/v1/entities?type=..." -H ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `libra --version`.
    validations:
      required: true
  - type: input
    id: broker
    attributes:
      label: Broker
      description: The context broker and its version behind Libra.
      placeholder: Scorpio, with the version it reports
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Configuration, policies, and logs
      description: Relevant sections and log lines. Remove API keys, tokens, key store contents, and tenant data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "This is not a security vulnerability. Vulnerabilities are reported privately, following the [Libra security policy](https://github.com/vela-tools/libra/security/policy)."
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed any credentials or private data from the report and samples above.
          required: true
