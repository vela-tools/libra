name: Bug report
description: Broken on its own terms, with no spec clause at stake.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report a security vulnerability. A policy that allows more than it says, a response carrying data a restriction should have removed, or a credential reaching the broker is a vulnerability. Follow the [Libra security policy](https://github.com/vela-tools/libra/security/policy) instead.

        Fill in what you know now. Every field becomes a heading, so the body is edited in place as understanding grows. Triage adds one `area:` label.
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened (a crash, a refusal to start, a wrong status, a wrong body), with the status code, the problem details body and the log lines that show it.
      placeholder: Libra answered 400 to ..., or refused to start with ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest configuration, policy and request that trigger it. Say how often it reproduces.
      placeholder: |
        1. Policy: ...
        2. curl -s "localhost:5667/ngsi-ld/v1/entities?type=..." -H ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: "What should have happened and what says so: Libra's documentation or an invariant. If an ETSI GS CIM 009 or JSON-LD clause decides it, use the Conformance report form instead."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `libra --version`.
    validations:
      required: true
  - type: input
    id: broker
    attributes:
      label: Broker
      description: The context broker and its version behind Libra.
      placeholder: Scorpio, with the version it reports
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Configuration, policies, and logs
      description: Relevant sections and log lines. Remove API keys, tokens, key store contents, and tenant data first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Optional; triage completes it. One checkbox per observable check: the input or situation, and the result that must hold. A reviewer can verify each one without reading the code."
      value: "- [ ] "
    validations:
      required: false
  - type: textarea
    id: leads
    attributes:
      label: Leads
      description: Suspected cause or where to look. A hypothesis, not a plan.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "This is not a security vulnerability. Vulnerabilities are reported privately, following the [Libra security policy](https://github.com/vela-tools/libra/security/policy)."
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed any credentials or private data from the report and samples above.
          required: true
